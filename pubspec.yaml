name: coursevault_app
description: CourseVault student productivity auth and profile module.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  shared_preferences: ^2.2.2
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_storage: any
  image_picker: ^1.0.4
  rxdart: ^0.27.7
  fl_chart: ^0.66.0
  url_launcher: ^6.2.4
  file_picker: ^8.0.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
